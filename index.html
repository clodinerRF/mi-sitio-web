<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web Minimalista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor del Video de Fondo -->
    <div class="video-background">
        <video id="background-video" autoplay muted loop poster="assets/fondo-estatico.jpg" playsinline>
            <source src="assets/mi-fondo.mp4" type="video/mp4">
            Tu navegador no soporta la etiqueta de video.
        </video>
    </div>

    <!-- Contenedor Principal (El Recuadro Centrado a la Izquierda) -->
    <div class="main-container">
        <div class="flip-card-inner">
            
            <!-- ANVERSO de la Tarjeta (Lo que se ve al cargar) -->
            <div class="card-front">
                
                <!-- Contenedor de Gráficos (Rayas y Logo RAF) -->
                <div class="graphics-area">
                    <img src="assets/raf-stripes.png" alt="Diseño gráfico de rayas abstractas" class="stripes-img">
                    <img src="assets/raf-logo.png" alt="Logotipo de RAF, Agencia de Creatividad" class="logo-img">
                </div>
                
                <!-- ÁREA DE NAVEGACIÓN INFERIOR (Cambiado de <span> a <a> para accesibilidad) -->
                <div class="nav-links">
                    <a href="#" id="contact-link" class="nav-link" aria-label="Ver datos de contacto">CONTACT</a>
                    <div class="separator-line"></div>
                    <a href="#" id="about-link" class="nav-link" aria-label="Abrir información de la agencia">ABOUT</a>
                </div>

            </div>
            
            <!-- REVERSO de la Tarjeta (Lo que aparece al girar) -->
            <div class="card-back">
                <!-- Información de Contacto (con enlaces funcionales) -->
                <div class="contact-info">
                    <a href="mailto:c.rodriguez@raf-sl.com" class="contact-email-link">c.rodriguez@raf-sl.com</a>
                    <a href="tel:+34678417323" class="contact-phone-link">678 417 323</a>
                    
                    <p class="contact-address">
                        C/Príncipe de Vergara, 266
                    </p>
                </div>

                <!-- Botón de Volver -->
                <button id="back-btn" class="back-button" aria-label="Volver a la vista principal">
                    <span class="back-icon">←</span>
                </button>
            </div>

        </div>
    </div>
    
    <!-- VENTANA DE INFORMACIÓN (Panel lateral) -->
    <!-- Se añadió ID info-panel-title para accesibilidad -->
    <div id="info-panel" class="info-panel" role="dialog" aria-modal="true" aria-labelledby="info-panel-title">
        
        <!-- Contenedor Wrapper Fijo -->
        <div class="sticky-panel-header">
            <!-- Contenido Fijo Superior del Panel About -->
            <div class="panel-header">
                <img src="assets/raf-logo.png" alt="Logotipo de RAF" class="panel-logo">
                <p class="panel-description" id="info-panel-title">Creatividad,<br>diseño gráfico<br>y comunicación.</p>
            </div>

            <!-- Navegación US | WORK (CON SEPARADOR HORIZONTAL) -->
            <div class="panel-nav">
                <button id="nav-us" class="panel-nav-btn">US</button>
                <div class="panel-separator"></div>
                <button id="nav-work" class="panel-nav-btn">WORK</button>
            </div>
            
            <!-- Botón de Cierre 'X' (Ahora dentro del wrapper fijo) -->
            <button id="close-info-btn" class="close-button" aria-label="Cerrar panel de información">
                <span class="close-icon">X</span>
            </button>
        </div> 
        <!-- Fin Contenedor Wrapper Fijo -->


        <!-- Contenedores de Contenido Dinámico (Controlados por JS) -->
        <div class="info-content" id="info-content-us" style="display: none;">
            <!-- El texto de US se cargará aquí vía JS -->
        </div>
        
        <div class="info-content" id="info-content-work" style="display: none;">
             <!-- El contenido de WORK se cargará aquí vía JS -->
        </div>
    </div>

    <!-- ESTRUCTURA DEL POP-UP / VENTANA MODAL DE PROYECTOS -->
    <div id="work-modal" class="work-modal">
        <div class="modal-content">
            <button id="close-modal-btn" class="close-button close-modal-btn" aria-label="Cerrar proyecto">
                <span class="close-icon">X</span>
            </button>
            
            <!-- AÑADIMOS BOTONES DE NAVEGACIÓN NUEVOS -->
            <button id="modal-prev-btn" class="modal-nav-btn prev-btn" aria-label="Proyecto anterior"><span class="nav-icon"><</span></button>
            <button id="modal-next-btn" class="modal-nav-btn next-btn" aria-label="Proyecto siguiente"><span class="nav-icon">></span></button>
            <!-- FIN BOTONES DE NAVEGACIÓN -->

            <!-- SPINNER DE CARGA AÑADIDO AQUÍ -->
            <div id="modal-spinner" class="modal-spinner"></div>

            <div id="modal-body" class="modal-body">
                <!-- El contenido del proyecto se carga aquí por JS -->
            </div>
        </div>
    </div>

    <!-- Botón de Pausa/Reproducción en la esquina inferior derecha -->
    <button id="play-pause-btn" class="video-control-btn" aria-label="Pausar vídeo de fondo">Ⅱ</button>

    <!-- Enlace a nuestro archivo JavaScript -->
    <script src="script.js"></script>

</body>
</html>
